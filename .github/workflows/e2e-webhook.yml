name: E2E Webhook

on:
  workflow_dispatch:
    inputs:
      task_code:
        description: 'Codice del task temporaneo di prova (T-9xxx)'
        default: 'T-9001'

jobs:
  e2e-webhook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Regola di Andrea (24/10/2026): backup nuovo e verificato prima di OGNI variazione al database. Questo test crea (e poi toglie) un
      # task temporaneo T-9xxx nel progetto reale: e' una variazione. Se il bucket non e' configurato lo si dichiara.
      - uses: google-github-actions/setup-gcloud@v2
        if: vars.BUCKET_BACKUP_FIRESTORE != ''

      - name: Backup verificato prima della variazione
        if: vars.BUCKET_BACKUP_FIRESTORE != ''
        env:
          BUCKET: ${{ vars.BUCKET_BACKUP_FIRESTORE }}
          FIRESTORE_PROJECT: avanza-b62d7
        run: |
          mkdir -p backup
          .claude/scripts/backup-firestore.sh backup

      - name: Backup NON eseguito (bucket non configurato)
        if: vars.BUCKET_BACKUP_FIRESTORE == ''
        run: |
          echo "::warning::Variazione al database (task temporaneo di prova) SENZA backup: manca la variabile BUCKET_BACKUP_FIRESTORE. Va detto ad Andrea."

      - name: Test webhook end-to-end
        run: node scripts/e2e-webhook.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_CODE: ${{ inputs.task_code }}
