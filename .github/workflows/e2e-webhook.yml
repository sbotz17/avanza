name: E2E Webhook

on:
  workflow_dispatch:
    inputs:
      task_code:
        description: 'Codice del task temporaneo di prova (T-9xxx)'
        default: 'T-9001'

jobs:
  e2e-webhook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Test webhook end-to-end
        run: node scripts/e2e-webhook.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_CODE: ${{ inputs.task_code }}
