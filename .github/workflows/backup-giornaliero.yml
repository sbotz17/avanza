# Backup notturno di Firestore (produzione): export su un bucket Google Cloud Storage, impronta dei dati e prova di ripristino su
# una copia (deve dare IDENTICO; la copia viene eliminata a fine prova). Avvisa Andrea se qualcosa non va; il lunedi' conferma che e' tutto ok.
# NON PROVATO su GitHub. Parte SOLO se Andrea ha creato il bucket e impostato la variabile BUCKET_BACKUP_FIRESTORE: senza non fa nulla.
# Il bucket deve avere un blocco di conservazione (retention) cosi' nessuno puo' cancellare i backup. Il service account
# (segreto FIREBASE_SERVICE_ACCOUNT) deve poter esportare/importare Firestore e scrivere nel bucket: vedi .github/README-CI.md.
# Gira anche con la squadra in blocco: il backup protegge, non modifica nulla.
name: backup-giornaliero
on:
  schedule:
    - cron: '17 2 * * *'      # ogni notte alle 02:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: produzione
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BUCKET_BACKUP_FIRESTORE != ''
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.BUCKET_BACKUP_FIRESTORE }}
      FIRESTORE_PROJECT: avanza-b62d7
      AVVISI_URL: ${{ secrets.AVVISI_URL }}
      AVVISI_TOKEN: ${{ secrets.AVVISI_TOKEN }}
      AVVISI_NUMERO: ${{ secrets.AVVISI_NUMERO }}
      AVVISI_PERMETTI_HTTP: ${{ vars.AVVISI_PERMETTI_HTTP }}
      AVVISI_PROGETTO: ${{ vars.NOME_PROGETTO || 'Avanza' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Functions dependencies (servono per leggere Firestore)
        run: npm ci
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Backup coerente (riprova se il database e' in attivita')
        env:
          BACKUP_TENTATIVI: "5"
          BACKUP_ATTESA: "120"
        run: |
          mkdir -p backup
          .claude/scripts/backup-firestore.sh backup
          echo "BACKUP_GS=$(jq -r .backup .claude/backup-ok.json)" >> "$GITHUB_ENV"
          echo "IMPRONTA_BACKUP=$(jq -r .file .claude/backup-ok.json)" >> "$GITHUB_ENV"

      - name: Prova di ripristino su copia (IDENTICO)
        run: .claude/scripts/ripristina-firestore.sh --verifica "$BACKUP_GS" --impronta "$IMPRONTA_BACKUP" --elimina-copia

      - name: Conferma settimanale
        if: success()
        run: |
          if [ "$(date -u +%u)" = "1" ]; then python3 .claude/scripts/avvisa-whatsapp.py altro "Backup notturno e prova di ripristino: tutto OK."; fi

      - name: Avviso di problema
        if: failure()
        run: python3 .claude/scripts/avvisa-whatsapp.py anomalia "Backup notturno o prova di ripristino NON riusciti. La produzione non e' stata toccata; va verificato."
