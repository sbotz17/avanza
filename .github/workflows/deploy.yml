name: Deploy Avanza Web

on:
  push:
    branches: [main, claude/epic-galileo-e9a406]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build web
        run: flutter build web --release --base-href / --pwa-strategy=none

      # Produzione (live): solo dal ramo main
      - name: Deploy to Firebase Hosting (live)
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: avanza-b62d7

      # Anteprima (preview): da rami di sviluppo e pull request
      - name: Deploy to Firebase Hosting (preview)
        if: github.ref != 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: preview
          expires: 7d
          projectId: avanza-b62d7
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

      # Cloud Functions: solo da main, dopo validazione Andrea
      - name: Setup Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Functions dependencies
        if: github.ref == 'refs/heads/main'
        run: npm ci
        working-directory: functions

      - name: Build Functions
        if: github.ref == 'refs/heads/main'
        run: npm run build
        working-directory: functions

      # gcloud al posto di firebase-tools: quest'ultimo pretende il permesso
      # cloudfunctions.functions.setIamPolicy (ruolo Cloud Functions Admin),
      # mentre gcloud rende pubblica la funzione tramite Cloud Run (run.invoker).
      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Functions
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud functions deploy githubWebhook \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --trigger-http \
            --allow-unauthenticated \
            --service-account=firebase-adminsdk-fbsvc@avanza-b62d7.iam.gserviceaccount.com \
            --source=functions \
            --entry-point=githubWebhook \
            --project=avanza-b62d7 \
            --quiet
